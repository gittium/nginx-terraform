<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Node Page</title>
  <style>
    /* Reset styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Dark blue theme */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0f24, #1c2a4d);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .container {
      background: rgba(20, 30, 60, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      padding: 30px 50px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #64b5f6; /* Light blue for contrast */
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 15px;
      line-height: 1.6;
      color: #bbdefb; /* Soft light blue text */
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello from Node Express App!</h1>
    <p>This is my custom HTML page.</p>
    <p>65310333 Kittichet Chalom</p>
  </div>
</body>
</html>
